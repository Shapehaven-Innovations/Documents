# Goes in the PUBLIC documents repo as .github/workflows/mirror.yml
# (not in the CondoGuard repo — that one is private, and a private repo's
# raw.githubusercontent.com URLs need a token the desktop app cannot ship).
#
# Pair with scripts/mirror.sh from this same directory.
name: mirror-rule-sources

on:
  schedule:
    # 07:00 UTC daily. Daily keeps consumers' own "check daily" setting honest —
    # a mirror slower than the consumer's schedule makes that setting theatre.
    # It is still only one fetch per source per day globally, which is far
    # gentler on a public .gov host than every install fetching on its own.
    # Cost is zero: Actions minutes are free on public repos.
    - cron: "0 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # pdftotext: the committed, diffable artifact for PDFs is extracted text.
      # A diff between two 11 MB binaries tells a reviewer nothing.
      - name: Install poppler-utils
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Fetch and validate sources
        run: bash scripts/mirror.sh

      # always(): mirror.sh exits non-zero when any single source failed, but
      # the sources that succeeded were still written and must not be discarded
      # because one site was down. The run stays red; the good data lands.
      - name: Commit only if content actually changed
        if: always()
        run: |
          git config user.name "condoguard-mirror-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A mirrors
          if git diff --staged --quiet; then
            echo "No change — nothing to commit."
          else
            git commit -m "mirror: refresh rule sources"
            git push
          fi
